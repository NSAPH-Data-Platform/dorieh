<text text-anchor="start" x="40.88" y="-241.2" font-family="Times,serif" font-size="14.00">Original Reason for Entitlement Code</text>
<text text-anchor="start" x="39.75" y="-224.7" font-family="Times,serif" font-size="14.00">(OREC). Set at the time of enrollment</text>
<text text-anchor="start" x="60.75" y="-208.2" font-family="Times,serif" font-size="14.00">and invariant for the life of the</text>
<text text-anchor="start" x="42.75" y="-191.7" font-family="Times,serif" font-size="14.00">beneficiary, hence a beneficiary&#45;level</text>
<text text-anchor="start" x="41.25" y="-175.2" font-family="Times,serif" font-size="14.00">attribute. The canonical value is taken</text>
<text text-anchor="start" x="41.25" y="-158.7" font-family="Times,serif" font-size="14.00">from the earliest enrollment year (ties</text>
<text text-anchor="start" x="66.75" y="-142.2" font-family="Times,serif" font-size="14.00">broken by smallest code, for</text>
<text text-anchor="start" x="52.5" y="-125.7" font-family="Times,serif" font-size="14.00">reproducibility). If the raw data is</text>
<text text-anchor="start" x="36" y="-109.2" font-family="Times,serif" font-size="14.00">inconsistent across years the divergence</text>
<text text-anchor="start" x="70.5" y="-92.7" font-family="Times,serif" font-size="14.00">is surfaced via orec_latest /</text>
<text text-anchor="start" x="49.88" y="-76.2" font-family="Times,serif" font-size="14.00">consistent_orec rather than silently</text>
<text text-anchor="start" x="103.88" y="-59.7" font-family="Times,serif" font-size="14.00">affecting joins.</text>
<polygon fill="none" stroke="black" points="11,-7 11,-29.5 278.5,-29.5 278.5,-7 11,-7"/>
<text text-anchor="start" x="14" y="-13.2" font-family="Times,serif" font-size="14.00">(array_agg(orec ORDER BY year, orec))[1]</text>
<polygon fill="none" stroke="black" points="8,-4 8,-305 281.5,-305 281.5,-4 8,-4"/>
