<text text-anchor="start" x="94.25" y="-488.2" font-family="Times,serif" font-size="14.00">Original Reason for Entitlement Code</text>
<text text-anchor="start" x="93.12" y="-471.7" font-family="Times,serif" font-size="14.00">(OREC). Set at the time of enrollment</text>
<text text-anchor="start" x="114.12" y="-455.2" font-family="Times,serif" font-size="14.00">and invariant for the life of the</text>
<text text-anchor="start" x="96.12" y="-438.7" font-family="Times,serif" font-size="14.00">beneficiary, hence a beneficiary&#45;level</text>
<text text-anchor="start" x="94.62" y="-422.2" font-family="Times,serif" font-size="14.00">attribute. The canonical value is taken</text>
<text text-anchor="start" x="94.62" y="-405.7" font-family="Times,serif" font-size="14.00">from the earliest enrollment year (ties</text>
<text text-anchor="start" x="120.12" y="-389.2" font-family="Times,serif" font-size="14.00">broken by smallest code, for</text>
<text text-anchor="start" x="105.88" y="-372.7" font-family="Times,serif" font-size="14.00">reproducibility). If the raw data is</text>
<text text-anchor="start" x="89.38" y="-356.2" font-family="Times,serif" font-size="14.00">inconsistent across years the divergence</text>
<text text-anchor="start" x="123.88" y="-339.7" font-family="Times,serif" font-size="14.00">is surfaced via orec_latest /</text>
<text text-anchor="start" x="103.25" y="-323.2" font-family="Times,serif" font-size="14.00">consistent_orec rather than silently</text>
<text text-anchor="start" x="157.25" y="-306.7" font-family="Times,serif" font-size="14.00">affecting joins.</text>
<polygon fill="none" stroke="black" points="64.38,-254 64.38,-276.5 331.88,-276.5 331.88,-254 64.38,-254"/>
<text text-anchor="start" x="67.38" y="-260.2" font-family="Times,serif" font-size="14.00">(array_agg(orec ORDER BY year, orec))[1]</text>
<polygon fill="none" stroke="black" points="61.38,-251 61.38,-552 334.88,-552 334.88,-251 61.38,-251"/>
